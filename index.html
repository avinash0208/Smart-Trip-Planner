<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartPlanner — AI Travel & Itinerary Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script>
      // GitHub Pages serves the static 404.html for deep links. Restore the
      // route it forwards here before React Router starts.
      (function () {
        var route = new URLSearchParams(window.location.search).get('route')
        if (route) {
          window.history.replaceState(null, '', '/Smart-Trip-Planner' + route)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
